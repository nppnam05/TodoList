# Flyway Configuration for TodoList Database
# ======================================

# Migration locations - Organized by schema
# Each schema has structure/ and data/ subfolders
flyway.locations=filesystem:migrations/structure,filesystem:migrations/data

# Schema history table
flyway.table=schema_version

# Validation settings
flyway.validateOnMigrate=true

flyway.outOfOrder=true

# Encoding for SQL files
flyway.encoding=UTF-8

# Placeholders (if needed)
flyway.placeholderReplacement=false

# Mixed mode (allows running both versioned and repeatable migrations)
flyway.mixed=false

# Clean disabled for safety (never use in production)
flyway.cleanDisabled=false

